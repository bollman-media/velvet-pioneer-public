<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Eraser — Loading State Prototype</title>
    <meta name="description" content="Image editing loading state with amorphous blur transition.">
    <link href="https://fonts.cdnfonts.com/css/google-sans" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
    <style>
        /* ── Motion Tokens (Sovereign Motion Architect) ────── */
        :root {
            --motion-enter:   480ms cubic-bezier(0.16, 1, 0.3, 1);
            --motion-exit:    320ms cubic-bezier(0.4, 0, 1, 1);
            --motion-settle:  620ms cubic-bezier(0.16, 1, 0.3, 1);
            --motion-micro:   180ms cubic-bezier(0.4, 0, 0.2, 1);
            --motion-stagger:  60ms;
            --motion-reveal:  1400ms cubic-bezier(0.16, 1, 0.3, 1);

            --bg: #030303;
            --surface-1: rgba(255, 255, 255, 0.02);
            --surface-2: rgba(255, 255, 255, 0.04);
            --text-primary: #ededed;
            --text-secondary: #9aa0a6;
            --text-tertiary: #5f6368;
            --accent: #8ab4f8;
            --accent-glow: rgba(138, 180, 248, 0.1);
            --line: rgba(255, 255, 255, 0.06);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'Google Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* ── Header ──────────────────────────────────────────── */
        .header {
            text-align: center;
            animation: fadeUp var(--motion-settle) both;
        }

        .eyebrow {
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
            display: block;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin: 0;
            background: linear-gradient(to bottom, #fff 50%, #aaa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ── Workspace (Image Container) ─────────────────────── */
        .workspace {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--line);
            background: #0a0a0a;
            box-shadow: 0 24px 48px rgba(0,0,0,0.6);
            animation: fadeUp var(--motion-settle) both;
            animation-delay: 100ms;
        }

        /* ── Base Image Layer ────────────────────────────────── */
        .image-layer {
            position: absolute;
            inset: 0;
            z-index: 1;
            will-change: filter, transform;
            transition:
                filter var(--motion-reveal),
                transform var(--motion-reveal);
        }

        .image-layer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ── Amorphous Loading Layer (Hidden by default) ─────── */
        .loading-layer {
            position: absolute;
            inset: -20%;
            z-index: 2;
            filter: blur(50px);
            opacity: 0;
            transition: opacity 600ms var(--motion-enter);
            pointer-events: none;
            mix-blend-mode: screen; /* Blends nicely over the blurred image */
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(20px);
            will-change: transform;
        }

        .blob-1 {
            width: 50%; height: 50%;
            top: 20%; left: 10%;
            background: radial-gradient(circle, rgba(138, 180, 248, 0.8), transparent 70%);
            animation: float1 6s ease-in-out infinite alternate;
        }

        .blob-2 {
            width: 45%; height: 45%;
            bottom: 10%; right: 10%;
            background: radial-gradient(circle, rgba(197, 138, 249, 0.7), transparent 70%);
            animation: float2 7s ease-in-out infinite alternate;
        }

        /* ── Shimmer Sweep ───────────────────────────────────── */
        .shimmer-layer {
            position: absolute;
            inset: 0;
            z-index: 3;
            overflow: hidden;
            opacity: 0;
            transition: opacity 400ms var(--motion-enter);
            pointer-events: none;
        }

        .shimmer-layer::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 300%; height: 100%;
            background: linear-gradient(
                105deg,
                transparent 20%,
                rgba(255,255,255,0.05) 35%,
                rgba(255,255,255,0.1) 50%,
                rgba(255,255,255,0.05) 65%,
                transparent 80%
            );
            animation: sweep 2.5s infinite linear;
            will-change: transform;
        }

        /* ── UI Controls Overlay ─────────────────────────────── */
        .ui-overlay {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            pointer-events: none;
        }

        .top-bar, .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .pill-btn {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 100px;
            padding: 8px 14px;
            color: #fff;
            font-size: 0.75rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            pointer-events: auto;
            transition: background 0.2s, border-color 0.2s;
        }
        .pill-btn:hover {
            background: rgba(0, 0, 0, 0.8);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .circle-btn {
            width: 40px; height: 40px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: background 0.2s, transform 0.2s var(--motion-micro);
        }
        .circle-btn:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: scale(1.05);
        }
        .circle-btn:active { transform: scale(0.95); }

        .circle-btn .material-symbols-outlined { font-size: 20px; }

        /* ── APP STATES ──────────────────────────────────────── */

        /* 1. EDITING STATE: Image blurs, loading appears */
        .workspace.is-editing .image-layer {
            filter: blur(20px) saturate(1.2);
            transform: scale(1.05);
        }

        .workspace.is-editing .loading-layer {
            opacity: 1;
        }

        .workspace.is-editing .shimmer-layer {
            opacity: 1;
        }

        /* 2. REVEALING STATE: Loading fades out, image un-blurs */
        .workspace.is-revealing .loading-layer {
            opacity: 0;
            transition: opacity 800ms var(--motion-exit);
        }

        .workspace.is-revealing .shimmer-layer {
            opacity: 0;
            transition: opacity 400ms var(--motion-exit);
        }

        .workspace.is-revealing .image-layer {
            filter: blur(0px) saturate(1);
            transform: scale(1);
            transition:
                filter var(--motion-reveal),
                transform var(--motion-reveal);
        }

        /* ── Action Button Area (External to workspace) ─────── */
        .controls {
            display: flex;
            justify-content: center;
            gap: 16px;
            animation: fadeUp var(--motion-settle) both;
            animation-delay: 200ms;
        }

        .btn {
            background: var(--surface-1);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 24px;
            color: #fff;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s var(--ease);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover {
            background: var(--surface-2);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }
        .btn:active { transform: translateY(0); }

        .btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
        }
        .btn-primary:hover {
            background: #a4c9ff;
            box-shadow: 0 8px 24px rgba(138, 180, 248, 0.2);
        }

        .btn .material-symbols-outlined { font-size: 18px; }

        /* ── Keyframes ───────────────────────────────────────── */
        @keyframes float1 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, -5%) scale(1.1); }
        }

        @keyframes float2 {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-8%, 8%) scale(1.05); }
        }

        @keyframes sweep {
            from { transform: translateX(-100%); }
            to   { transform: translateX(100%); }
        }

        /* ── Back Link ───────────────────────────────────────── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: color 0.3s;
            margin: 0 auto;
            animation: fadeUp var(--motion-settle) both;
            animation-delay: 300ms;
        }
        .back-link:hover { color: #fff; }
        .back-link .material-symbols-outlined { font-size: 16px; transition: transform 0.3s; }
        .back-link:hover .material-symbols-outlined { transform: translateX(-4px); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="eyebrow">Motion Prototype</span>
            <h1 class="title">Magic Eraser</h1>
        </div>

        <!-- ── Image Workspace ── -->
        <div class="workspace" id="workspace">
            
            <!-- Layer 1: Image -->
            <div class="image-layer" id="image-layer">
                <!-- Using an existing image from the workspace -->
                <img src="../omni/landscape.png" alt="Workspace Image" id="target-media">
            </div>

            <!-- Layer 2: Amorphous Blurry Loading -->
            <div class="loading-layer">
                <div class="blob blob-1"></div>
                <div class="blob blob-2"></div>
            </div>

            <!-- Layer 3: Shimmer Sweep -->
            <div class="shimmer-layer"></div>

            <!-- Layer 4: UI Controls -->
            <div class="ui-overlay">
                <div class="top-bar">
                    <div class="pill-btn">
                        <span class="material-symbols-outlined">auto_awesome</span>
                        <span>Gemini Gen</span>
                    </div>
                    <div class="circle-btn" aria-label="Close">
                        <span class="material-symbols-outlined">close</span>
                    </div>
                </div>
                
                <div class="bottom-bar">
                    <div class="circle-btn" id="eraser-tool" aria-label="Magic Eraser">
                        <span class="material-symbols-outlined">ink_eraser</span>
                    </div>
                    <div class="pill-btn" id="status-pill" style="opacity: 0; transition: opacity 0.3s;">
                        <span>Processing…</span>
                    </div>
                    <div class="circle-btn" aria-label="Settings">
                        <span class="material-symbols-outlined">tune</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ── External Controls ── -->
        <div class="controls" style="flex-direction: column; gap: 16px;">
            <div style="display: flex; gap: 16px; width: 100%;">
                <button class="btn" id="btn-reset" style="flex: 1;">
                    <span class="material-symbols-outlined">replay</span>
                    Reset
                </button>
                <button class="btn btn-primary" id="btn-trigger" style="flex: 2;">
                    <span class="material-symbols-outlined">celebration</span>
                    Simulate Edit
                </button>
            </div>
            
            <!-- Speed Slider -->
            <div style="display: flex; flex-direction: column; gap: 8px; width: 100%; background: var(--surface-1); padding: 16px; border-radius: 12px; border: 1px solid var(--line);">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">Processing Duration</span>
                    <span id="speed-value" style="font-size: 0.75rem; font-weight: 600; color: var(--accent);">3.0s</span>
                </div>
                <input type="range" id="speed-slider" min="0.5" max="10" step="0.5" value="3" style="width: 100%; accent-color: var(--accent); background: rgba(255,255,255,0.05); border-radius: 4px; height: 6px;">
            </div>
        </div>

        <a href="./index.html" class="back-link">
            <span class="material-symbols-outlined">arrow_back</span>
            Back to Hub
        </a>
    </div>

    <script>
        const workspace = document.getElementById('workspace');
        const eraserTool = document.getElementById('eraser-tool');
        const statusPill = document.getElementById('status-pill');
        const btnTrigger = document.getElementById('btn-trigger');
        const btnReset = document.getElementById('btn-reset');
        const targetMedia = document.getElementById('target-media');
        const speedSlider = document.getElementById('speed-slider');
        const speedValue = document.getElementById('speed-value');

        let isProcessing = false;

        speedSlider.addEventListener('input', (e) => {
            speedValue.textContent = parseFloat(e.target.value).toFixed(1) + 's';
        });

        function runFlow() {
            if (isProcessing) return;
            isProcessing = true;

            const duration = parseFloat(speedSlider.value) * 1000;

            // ── Step 1: Trigger Edit (Blur image + show progress) ──
            workspace.classList.add('is-editing');
            statusPill.style.opacity = '1';
            
            // Simulate active tool feedback
            eraserTool.style.background = 'var(--accent)';
            eraserTool.style.color = '#000';

            // ── Step 2: Processing (Hold for slider duration) ──
            setTimeout(() => {
                // ── Step 3: Reveal (Fade out loading, un-blur image) ──
                workspace.classList.remove('is-editing');
                workspace.classList.add('is-revealing');
                statusPill.style.opacity = '0';
                
                eraserTool.style.background = '';
                eraserTool.style.color = '';

                // ── Step 4: Cleanup ──
                setTimeout(() => {
                    workspace.classList.remove('is-revealing');
                    isProcessing = false;
                }, 1400); // Matches --motion-reveal
                
            }, duration); 
        }

        function reset() {
            workspace.className = 'workspace';
            statusPill.style.opacity = '0';
            eraserTool.style.background = '';
            eraserTool.style.color = '';
            isProcessing = false;
        }

        eraserTool.addEventListener('click', runFlow);
        btnTrigger.addEventListener('click', runFlow);
        btnReset.addEventListener('click', reset);
    </script>
</body>
</html>
